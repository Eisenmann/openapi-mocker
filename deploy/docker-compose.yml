services:
  openapi-mocker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openapi-mocker:latest
    container_name: openapi-mocker
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - mocker-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/openapi-mocker", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mocker-data:
