name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The timing-sensitive accuracy tests have their own job below.
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -skip '^TestAccuracy_'
      - name: Enforce coverage threshold (70%)
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk -v c="$COVERAGE" -v t=70 'BEGIN { exit !(c < t) }'; then
            echo "::error::Coverage ${COVERAGE}% is below the required 70% threshold."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  accuracy:
    name: Load tester accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Compares the load tester's percentiles with what the server measured, so
      # it is timing-sensitive: it runs on its own (no other tests, no race
      # detector). A failure fails the pipeline.
      - run: go test ./internal/loadtest/ -run '^TestAccuracy_' -count=1 -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, accuracy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: openapi-mocker:ci
      - name: Image smoke test
        run: bash deploy/smoke-test.sh openapi-mocker:ci
