# Configuration file for golangci-lint (v2 config format).
# https://golangci-lint.run/
#
# The project follows a pragmatic convention where:
#   - errors from I/O like http.ResponseWriter.Write are intentionally ignored
#     in thin HTTP handlers (the response is already in flight).
#   - domain-layer structs carry encoding/json tags (standard library only).
#   - comments are in English and do not always end with a period.
#   - mock-serving uses math/rand (non-crypto) by design.
#
# The settings below are tuned to this codebase so the linter stays useful
# without drowning the developer in style-based noise.

version: "2"

# ---------------------------------------------------------------------------
# Run / analysis options
# ---------------------------------------------------------------------------
run:
  # Timeout for the whole lint run.
  timeout: 5m
  # Resolve paths relative to go.mod (the module root).
  relative-path-mode: gomod
  # Go version from go.mod — used for language-version-aware linters.
  go: "1.26"
  # Also lint test files.
  tests: true
  # Allow golangci-lint to pick up build info from VCS automatically.
  enable-build-vcs: true
  # Concurrency (0 = auto, based on available CPUs).
  concurrency: 0

# ---------------------------------------------------------------------------
# Linters
# ---------------------------------------------------------------------------
linters:
  # Start from the curated "standard" set (govet, staticcheck, errcheck, …).
  default: standard
  # Enable additional linters that are useful for this project.
  enable:
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - fatcontext
    - funcorder
    - funlen
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - gosec
    - govet
    - iface
    - interfacebloat
    - intrange
    - ireturn
    - misspell
    - mnd
    - lll
    - nakedret
    - nilnil
    - nosprintfhostport
    - noctx
    - noinlineerr
    - paralleltest
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
    - wastedassign
    - gomodguard_v2
  # Disable linters that produce noise in this codebase.
  disable:
    - wrapcheck  # wrapping every stdlib error adds noise without much value here
    - gochecknoglobals  # composition-root globals are intentional in some deployments
  settings:
    depguard:
      rules:
        usecase:
          files:
            - "internal/usecase/**"
          deny:
            - pkg: "github.com/Eisenmann/openapi-mocker/internal/adapter"
              desc: "usecase must not depend on adapters"
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    godot:
      # English comments are the project convention; check punctuation only.
      capital: false
      scope: all
      period: true
    lll:
      # The project uses long descriptive names and English comments.
      line-length: 120
      tab-width: 1
    nakedret:
      max-func-lines: 10
    gomodguard_v2:
      allowed:
        - module: github.com/agnivade/levenshtein
        - module: github.com/getkin/kin-openapi
        - module: github.com/go-openapi/jsonpointer
        - module: github.com/go-openapi/swag
        - module: github.com/invopop/yaml
        - module: github.com/josharian/intern
        - module: github.com/mailru/easyjson
        - module: github.com/mohae/deepcopy
        - module: github.com/perimeterx/marshmallow
        - module: github.com/vektah/gqlparser/v2
        - module: gopkg.in/yaml.v3
      blocked: []
    ireturn:
      # The llm provider factory legitimately returns the internal
      # `provider` interface (strategy pattern over five HTTP backends).
      # The codegen usecase returns ports.CodeGeneratorPort — returning
      # the port is the point of the selectAdapter function.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - provider
        - CodeGeneratorPort
  # -----------------------------------------------------------------------
  # Per-linter / per-path exclusions tuned to the patterns seen in this code.
  # -----------------------------------------------------------------------
  exclusions:
    # Mode of the generated files analysis.
    generated: lax
    # Log a warning if an exclusion rule is unused.
    warn-unused: true
    # Predefined exclusion rule presets.
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # math/rand is used on purpose for chaos-testing, not cryptography.
      - path: internal/usecase/mockserving_service\.go$
        linters:
          - gosec
        text: "G404"
      # math/rand is used on purpose for generating random mock example
      # values (no security requirement) — crypto/rand is unnecessary.
      - path: internal/adapter/openapi/example\.go$
        linters:
          - gosec
        text: "G404"
      # Writing mock/GraphQL responses to http.ResponseWriter is the whole
      # point of these handlers; the gosec G705 taint heuristic does not
      # apply to a mock server that intentionally echoes contract-shaped
      # data. Error checking of these writes is governed by errcheck rules.
      - path: internal/adapter/httpapi/.*\.go$
        linters:
          - gosec
        text: "G705"
      # Multipart upload parsing in saveContract is already bounded by
      # http.MaxBytesReader (maxJSONBodyBytes); the G120 heuristic cannot see
      # the bound and flags the access anyway — false positive here.
      - path: internal/adapter/httpapi/handlers_contracts\.go$
        linters:
          - gosec
        text: "G120"
      # Partial struct literals are intentional throughout these packages:
      #   - http.Client/Server rely on idiomatic zero-value defaults;
      #   - gqlparser ast.Source has BuiltIn=false by design for app SDL;
      #   - usecase result/DTO structs omit fields meaning "empty/not
      #     applicable" for the response shape;
      #   - Engine/Store start with a zero-value mutex.
      - path: (cmd/server|internal/adapter/(graphql|openapi|llm|repository/jsonstore))/
        linters:
          - exhaustruct_v5
      # Test files use partial struct literals for mocks/stubs and have
      # naturally high cyclomatic complexity from table-driven assertions.
      # These are intentional test patterns, not production-code smells.
      - path: _test\.go$
        linters:
          - exhaustruct_v5
          - cyclop
          - funlen
          - gocognit
          - mnd
          - noinlineerr
          - testpackage
          - unused-parameter
          - wsl_v5
          - err113
          - goconst
          - lll
          - noctx
          - errchkjson
          - gosec
          - gocritic
          - funcorder
          - unused
          - paralleltest
          - tparallel
          - thelper
          - testifylint
          - wastedassign
          - prealloc
          - perfsprint
          - nakedret
          - nilnil
          - intrange
          - iface
          - interfacebloat
          - ireturn
          - godot
          - godox
          - gomodguard_v2
          - containedctx
          - contextcheck
          - copyloopvar
          - decorder
          - depguard
          - dupl
          - embeddedstructfieldcheck
          - errname
          - errorlint
          - exhaustive
          - fatcontext
          - misspell
          - nosprintfhostport
          - unconvert
          - unparam
          - whitespace
          - bidichk
          - revive
      # The mock example generator walks arbitrary OpenAPI schemas and
      # necessarily has high cyclomatic complexity — it is a data-driven
      # walker, not business logic that can be meaningfully simplified.
      - path: internal/adapter/openapi/example\.go$
        linters:
          - cyclop
          - mnd
          - errchkjson
          - goconst
      # Dynamic errors are intentional for "operation not found" style
      # messages that must include the method/path in the text.
      - path: internal/adapter/(openapi|llm)/
        linters:
          - err113
      # The codegen adapters wrap sentinel errors with %w and add context
      # (e.g. "failed to write schema: ...") — the wrapped sentinel is
      # still inspectable via errors.Is, so err113 is satisfied.
      - path: internal/adapter/codegen/
        linters:
          - err113
      # The codegen/router/agents packages use partial struct literals
      # intentionally — omitted fields mean "empty/not applicable" for
      # the response shape or are zero-value defaults.
      - path: (internal/adapter/(codegen|router)|internal/agents)/
        linters:
          - exhaustruct_v5
      # The codegen adapters and router use inline error handling and
      # whitespace style consistent with the rest of the codebase.
      - path: internal/adapter/(codegen|router)/
        linters:
          - noinlineerr
          - wsl_v5
      # usecase DTOs (MockResponse, RequestLog) intentionally use partial
      # struct literals — omitted fields mean "empty/not applicable".
      - path: internal/usecase/
        linters:
          - exhaustruct_v5
      # Configuration values (timeouts, limits, buffer sizes) are written
      # as literals at the composition root and in store internals.
      - path: (cmd/server|internal/adapter/httpapi|internal/adapter/repository/jsonstore)/
        linters:
          - mnd
      # Inline error handling (`if err := ...; err != nil`) is idiomatic Go
      # and is preferred in this codebase for short handler bodies.
      - path: (cmd/server|internal/adapter/(codegen|httpapi|openapi|repository/jsonstore))/
        linters:
          - noinlineerr
      # Whitespace style and method-ordering preferences are not enforced
      # in this codebase; gofmt/gofumpt handle formatting.
      - path: (internal/adapter/repository/jsonstore|internal/usecase|internal/adapter/openapi)/
        linters:
          - wsl_v5
          - funcorder
      # Long descriptive lines in GraphQL detection keyword lists are
      # intentional for readability.
      - path: internal/usecase/graphql_detect\.go$
        linters:
          - lll
      # The JSON store writes with 0644 so the data file is readable by
      # other processes in the container (e.g. sidecars); 0600 would break
      # that use case.
      - path: internal/adapter/repository/jsonstore/store\.go$
        linters:
          - gosec
        text: "G306"
      # Interface stubs and HTTP handlers may legitimately ignore some
      # parameters (e.g. health-check handlers don't need the request).
      - path: internal/adapter/httpapi/
        linters:
          - revive
        text: "unused-parameter"

# ---------------------------------------------------------------------------
# Formatters
# ---------------------------------------------------------------------------
formatters:
  enable:
    - gci
    - gofumpt
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Eisenmann/openapi-mocker)
  exclusions:
    generated: strict

# ---------------------------------------------------------------------------
# Issues output
# ---------------------------------------------------------------------------
issues:
  # Show every issue — don't cap per linter.
  max-issues-per-linter: 0
  # Don't deduplicate by text; surface unique locations.
  max-same-issues: 0
  # New-code-only mode is useful once the codebase stabilises; for now
  # report everything so existing issues are visible.
  new: false